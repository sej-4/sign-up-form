<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside>
      <img src="./images/halie-west-25xggax4bSA-unsplash.jpg" alt="Plants" />
      <div class="logo">
        <img src="./images/odin-lined.png" alt="The Odin Project logo" />
        <h1>ODIN</h1>
      </div>
      <p>
        Photo by
        <a href="https://unsplash.com/@haliewestphoto">Halie West</a> on
        <a
          href="https://unsplash.com/photos/green-leaf-plant-in-close-up-photography-25xggax4bSA"
          >Unsplash</a
        >
      </p>
    </aside>
    <main>
      <div class="call-to-action">
        <p>
          This is not a real online service! You know you need something like
          this in your life to help you realize your deepest dreams. Sign up
          <span>now</span>
          to get started.
        </p>
        <p>You <span>know</span> you want to.</p>
      </div>
      <div class="registration">
        <p>Let's do this!</p>
        <form action="#" method="get" id="register">
          <p>
            <label for="first-name">First Name</label>
            <input
              type="text"
              id="first-name"
              name="first-name"
              maxlength="50"
              required
            />
          </p>
          <p>
            <label for="last-name">Last Name</label>
            <input
              type="text"
              id="last-name"
              name="last-name"
              maxlength="50"
              required
            />
          </p>
          <p>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              maxlength="256"
              autocomplete="email"
              required
            />
          </p>
          <p>
            <label for="phone-number">Phone Number</label>
            <input
              type="tel"
              id="phone-number"
              name="phone-number"
              minlength="10"
              maxlength="15"
              autocomplete="tel"
              required
            />
          </p>
          <p>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="8"
              maxlength="20"
              required
            />
          </p>
          <p>
            <label for="confirm-password">Confirm Password</label>
            <input
              type="password"
              id="confirm-password"
              name="confirm-password"
              minlength="8"
              maxlength="20"
              required
            />
          </p>
        </form>
      </div>
      <div class="create-account">
        <button type="submit" form="register">Create Account</button>
        <p>Already have an account? <a href="">Log in</a></p>
      </div>
    </main>
  </body>
</html>
